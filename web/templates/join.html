<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke Ticker - Join</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="container">
    <h1>WELCOME TO KARAOKE</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
      {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
      {% endfor %}
      </ul>
    {% endif %}
    {% endwith %}
    <form method="post" action="{{ url_for('web.join_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="code">House Code</label>
      <input id="code" name="code" value="{{ code }}" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required>
      <label for="existing_name">Returning User (optional)</label>
      <select id="existing_name" name="existing_name">
        <option value="">-- Select existing name --</option>
        {% for user in users %}
        <option value="{{ user.display_name }}">{{ user.display_name }}</option>
        {% endfor %}
      </select>
      <label for="name">Your Name</label>
      <input id="name" name="name" maxlength="80" placeholder="Enter a new name">
      <button type="submit">JOIN</button>
    </form>
  </main>
</body>
</html>
